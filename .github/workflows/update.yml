name: 更新課表

on:
  schedule:
    - cron: '17 * * * *'   # 每小時第 17 分執行一次
  workflow_dispatch:        # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓課表
        run: node fetch.mjs
      - name: 有變動就存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "更新課表"
          git push
