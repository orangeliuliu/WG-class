<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Combat">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Combat 課表</title>
<style>
  :root { --bg:#111; --card:#1c1c1e; --line:#2c2c2e; --text:#f2f2f2; --dim:#9a9a9f; --accent:#f97316; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
         padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { font-size:22px; margin:4px 0 2px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:14px; }
  .label { color:var(--dim); font-size:13px; margin:10px 0 6px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--text);
          border-radius:12px; padding:8px 12px; font-size:15px; text-align:center; min-width:58px; }
  .chip small { display:block; color:var(--dim); font-size:12px; line-height:1.2; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.on small { color:#ffe4d0; }
  .search { display:flex; gap:8px; margin-top:12px; }
  .search input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--text);
                  border-radius:12px; padding:10px 12px; font-size:16px; }
  .tabs { position:sticky; top:0; z-index:5; background:var(--bg); display:flex; gap:6px; overflow-x:auto;
          margin:14px -16px 0; padding:8px 16px; border-bottom:1px solid var(--line); scrollbar-width:none; }
  .tabs[hidden] { display:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 auto; background:none; border:0; color:var(--dim); font-size:15px; padding:6px 10px; border-radius:10px; }
  .tab.on { color:#fff; background:var(--card); box-shadow:inset 0 -2px 0 var(--accent); font-weight:600; }
  .tab small { color:var(--dim); margin-left:4px; font-weight:400; }
  .count { margin:18px 0 4px; color:var(--dim); font-size:14px; }
  .day { margin-top:18px; color:var(--accent); font-weight:700; font-size:18px; }
  .row { display:flex; gap:12px; padding:9px 2px; border-bottom:1px solid var(--line); align-items:baseline; }
  .t { font-variant-numeric:tabular-nums; width:48px; color:var(--dim); }
  .s { font-weight:600; min-width:72px; }
  .tag { margin-left:4px; color:var(--accent); font-size:13px; }
  .empty { color:var(--dim); margin-top:24px; text-align:center; }
</style>
</head>
<body>
<h1>BODYCOMBAT 課表</h1>
<div class="sub">台北＋新北・<span id="updated">載入中…</span></div>

<div class="label">日期（可多選）</div>
<div class="chips" id="days"></div>

<div class="label">時段</div>
<div class="chips" id="slots"></div>

<div class="search">
  <input id="q" type="search" placeholder="或直接打：週三 週四 晚上 / 11/18 下午" enterkeyhint="search">
</div>

<div class="tabs" id="tabs" hidden></div>
<div class="count" id="count"></div>
<div id="list"></div>

<script>
const W = '日一二三四五六';
const SLOTS = { '整天':['00:00','23:59'], '早上':['00:00','12:00'], '下午':['12:00','18:00'], '晚上':['18:00','23:59'] };
let selDays = new Set();
let slot = '整天';

const tw = new Date(Date.now() + 8 * 3600e3);
const today = new Date(Date.UTC(tw.getUTCFullYear(), tw.getUTCMonth(), tw.getUTCDate()));
const ymd = d => d.toISOString().slice(0, 10);
const addDays = n => new Date(today.getTime() + n * 864e5);
const label = s => { const d = new Date(s + 'T00:00:00Z'); return `${d.getUTCMonth()+1}/${d.getUTCDate()}（${W[d.getUTCDay()]}）`; };

function dayChips() {
  const el = document.getElementById('days');
  el.innerHTML = '';
  const avail = Array.from({ length: 21 }, (_, i) => ymd(addDays(i)));
  avail.forEach((d, i) => {
    const dt = new Date(d + 'T00:00:00Z');
    const top = d === ymd(today) ? '今天' : d === ymd(addDays(1)) ? '明天' : '週' + W[dt.getUTCDay()];
    const b = document.createElement('button');
    b.className = 'chip' + (selDays.has(d) ? ' on' : '');
    b.innerHTML = `${top}<small>${dt.getUTCMonth()+1}/${dt.getUTCDate()}</small>`;
    b.onclick = () => { if (selDays.has(d)) selDays.delete(d); else { selDays.add(d); activeDay = d; } if (!selDays.size) selDays.add(d); document.getElementById('q').value=''; render(); };
    el.appendChild(b);
  });
}

function slotChips() {
  const el = document.getElementById('slots');
  el.innerHTML = '';
  Object.keys(SLOTS).forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip' + (k === slot ? ' on' : '');
    b.textContent = k;
    b.onclick = () => { slot = k; document.getElementById('q').value=''; render(); };
    el.appendChild(b);
  });
}

// 把「週三 週四 晚上」「11/18 下午」「明天」這類文字轉成日期與時段
function parse(q) {
  const ds = new Set();
  for (const m of q.matchAll(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/g)) {
    let y = today.getUTCFullYear(); if (+m[1] < today.getUTCMonth() + 1) y++;
    ds.add(ymd(new Date(Date.UTC(y, m[1] - 1, m[2]))));
  }
  const next = /下(?:個)?(?:週|周|星期|禮拜)/.test(q);
  for (const m of q.matchAll(/(?:週|周|星期|禮拜)([日天一二三四五六])/g)) {
    const w = m[1] === '天' ? 0 : W.indexOf(m[1]);
    let k = w - today.getUTCDay(); if (k < 0) k += 7;
    if (next) { const toMon = (8 - today.getUTCDay()) % 7 || 7; k = toMon + ((w + 6) % 7); }
    ds.add(ymd(addDays(k)));
  }
  if (/今天/.test(q)) ds.add(ymd(today));
  if (/明天/.test(q)) ds.add(ymd(addDays(1)));
  if (/後天/.test(q)) ds.add(ymd(addDays(2)));
  let s = null;
  if (/早上|上午/.test(q)) s = '早上'; else if (/下午/.test(q)) s = '下午'; else if (/晚上/.test(q)) s = '晚上'; else if (/整天|全天/.test(q)) s = '整天';
  return { ds, s };
}

// 每天的資料分開存：days[日期] = { status: 'loading' | 'ok' | 'fail', classes, sources }
const days = {};

function loadDay(d) {
  if (days[d] && days[d].status !== 'fail') return;
  days[d] = { status: 'loading', classes: [] };
  fetch('/api/classes?date=' + d, { signal: AbortSignal.timeout(20000) })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { days[d] = { status: 'ok', classes: j.classes, sources: j.sources }; })
    .catch(() => { days[d] = { status: 'fail', classes: [] }; })
    .finally(render);
}

let activeDay = null; // 多選日期時，目前頁籤顯示的那一天

const short = d => { const t = new Date(d + 'T00:00:00Z'); const top = d === ymd(today) ? '今天' : d === ymd(addDays(1)) ? '明天' : '週' + W[t.getUTCDay()]; return `${top} ${t.getUTCMonth()+1}/${t.getUTCDate()}`; };
const inSlot = c => { const [st, et] = SLOTS[slot]; return c.s >= st && c.s <= et; };

function render() {
  dayChips(); slotChips();
  const sel = [...selDays].sort();
  sel.forEach(loadDay);
  if (!selDays.has(activeDay)) activeDay = sel[0];

  // 日期頁籤：選兩天以上才出現，一次只顯示一天
  const tabs = document.getElementById('tabs');
  tabs.hidden = sel.length < 2;
  tabs.innerHTML = '';
  if (sel.length > 1) for (const d of sel) {
    const day = days[d];
    const n = day.status === 'ok' ? day.classes.filter(inSlot).length : day.status === 'loading' ? '…' : '✕';
    const b = document.createElement('button');
    b.className = 'tab' + (d === activeDay ? ' on' : '');
    b.innerHTML = `${short(d)}<small>${n}</small>`;
    b.onclick = () => { activeDay = d; render(); const top = document.getElementById('count').offsetTop - tabs.offsetHeight - 8; if (window.scrollY > top) window.scrollTo({ top }); };
    tabs.appendChild(b);
    if (d === activeDay) requestAnimationFrame(() => b.scrollIntoView({ inline: 'nearest', block: 'nearest' }));
  }

  const d = activeDay, day = days[d];
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  setStatus(day.sources && !day.sources.app ? 'App 課表沒回應，只顯示 wgc 資料' : '即時資料（World Gym App 課表＋wgc）');
  let h = `<div class="day">${label(d)}</div>`;
  if (day.status === 'loading') { count.textContent = '載入中…'; list.innerHTML = h + '<div class="empty">載入中…（每天約需 5 秒）</div>'; return; }
  if (day.status === 'fail') { count.textContent = ''; list.innerHTML = h + '<div class="empty">這天查詢失敗，請重新整理再試</div>'; return; }
  const rows = day.classes.filter(inSlot);
  count.textContent = `共 ${rows.length} 堂`;
  if (!rows.length) { list.innerHTML = h + '<div class="empty">沒有符合的課</div>'; return; }
  for (const c of rows)
    h += `<div class="row"><span class="t">${c.s}</span><span class="s">${c.store}</span><span>${c.teacher}${c.sub ? `<span class="tag">(代${c.orig ? ' ' + c.orig : ''})</span>` : ''}</span></div>`;
  list.innerHTML = h;
}

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const { ds, s } = parse(e.target.value);
  if (ds.size) { selDays = ds; activeDay = [...ds].sort()[0]; }
  if (s) slot = s;
  e.target.blur();
  render();
});

const setStatus = t => { document.getElementById('updated').textContent = t; };
selDays = new Set([ymd(today)]);
render();
</script>
</body>
</html>
